<H3> Save data </​​H3>

<P>
Make sure the object you want to save is selected. (If there are multiple objects you want to save, click “Multi” in the menu bar on the right side of the screen to select multiple objects.)
</P>

<P>
<B> [Save] → [Selected Models] </B> <BR>
please choose.
</P>

<P>
A window will appear. Check that the display is “Saving in Database &lt;STUDY&gt;” and click “Save”.
</P>
