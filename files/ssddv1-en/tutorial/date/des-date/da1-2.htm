<HTML> <HEAD> <TITLE> Conversion / check of SOFTIMAGE data </​​TITLE> </HEAD> <BODY> <P> <A HREF="da1-1.htm"> Return to previous page </A> ｜ <A HREF="../index.htm"> Return to menu </A> ｜ <A HREF="da1-3.htm"> Go to next page </A> </BR> </P > <HR> <H2> 1-2. Conversion / check of SOFTIMAGE data </​​H2> <P> Specification of data conversion, processing, and delivery procedures using TV monitor data created in the designer's tutorial as an example I will explain it. </P> <H3> Check data </​​H3> <P> Please open a UNIX shell. Enter </P> <P> <B> cd STUDY / MODELS (line feed) </B> </P> <P>. The path display should now be </P> <P> <B> [(Home Directory Name) / STUDY / MODELS] </B> </P> <P>. Here, please <B> ls (line feed) </B>. There should be “SATURN_TV_SET.1-0.hrc” here. </P> <BLOCKQUOTE> <P> <B> Caution </B> <BR> This is a version display, so it may not be “1-0”, but if the name is as above, there is a problem There is none. </P> </BLOCKQUOTE> <P> where </P> <P> <B> cp SATURN_TV_SET.1-0.hrc ‾ / CHECK (line feed) </B> </P> <P> Please enter. </P> <BLOCKQUOTE> <P> <B> Caution </B> <BR> "‾" is above the "TAB" key. “‾” indicates the home directory. This symbol is often used because it is convenient. </P> </BLOCKQUOTE> <P> Take another UNIX shell here and enter </P> <P> <B> cd CHECK (line feed) </P> </B> <P> And <B> ls (line feed) </B>. You can confirm that “SATURN_TV_SET.1-0.hrc” exists in this CHECK directory. If you confirm that there is no .hrc file other than this file, </P> <P> <B> slcon -c -f SATURN_TV_SET.1-0.hrc (line feed) </B> </P Enter> <P>. Then the following will be displayed. </P> <IMG SRC = "designp4.gif"> <P> The only models that can be put in Saturn are “Total of 3 nodes” and “Total of 4 nodes”. of 5 nodes ”should not be more. </P> <BLOCKQUOTE> <P> <B> Caution </B> <BR> Only models that meet the above conditions can be textured. How to paste textures using “SMAP” is explained in “Chapter 6 of Designer ’s Tutorial: How to use SMAP”. </P> </BLOCKQUOTE> <P> Finally, </P> <P> <B> mkdir ‾ / CONV (line feed) <BR> cp SATURN_TV_SET.1-0.hrc ‾ / CONV (line feed) </Type B> </P> <P> to copy the file as data to be passed to the programmer. </P> <P> Next, enter </P> <P> <B> cd ‾ / CONV (line feed) </P> </B> <P> to move the directory. <BR> Please <B> ls (line feed) </B> here. There should be a file here. <BR> Let's change the file name here. </P> <P> <B> mv SATURN_TV_SET.1-0.hrc sample.hrc (line feed) </P> </B> <P> will convert the file name to “sample.hrc” Will be. </P> <P> <B> If you don't want to add a texture: </B> <BR> Proceed to the next step using the file “sample.hrc” above. </P> <P> <B> To paste a texture: </B> <BR> Proceed to the next step assuming that “sample_smap.hrc” was generated by SAMP. </P> <HR> <P> <A HREF="da1-1.htm"> Return to previous page </A> | <A HREF="../index.htm"> Return to menu </A> ｜ <A HREF="da1-3.htm"> Go to next page </A> </BR> </P> </BODY> </HTML>
