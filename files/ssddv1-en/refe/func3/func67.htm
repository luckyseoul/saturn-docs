<H1>slSetSprite</H1>

<P ALIGN="right">
<B> Set of sprite data </​​B>
</P>

<H3> Format </H3>
<P>
void slSetSprite(parms , Zpos)<BR>
SPRITE *parms ;<BR>
FIXED Zpos ;
</P>

<H3> Parameter </H3>
<P>
start address of the area where parms sprite data is stored <BR>
ZposZ coordinate position
</P>

<H3> Function </H3>
<P>
Sets sprite control command data to be transferred to hardware in the transfer list. <BR>
Use this when you want to set a deformed sprite that cannot be created by a library function, or a window that affects only a specific sprite.
</P>

<H3> Return value </H3>
<P> None </P>

<H3> Remarks </H3>
<P>
<BR> for details on the execution contents of the function “slSetSprite”
Refer to “HARDWARE MANUAL vol.2” (VDP1 User's Manual: P.118 ~).
</P>

<P> Reference: Chapter 9 Controller Input </P>

slSetSprite
