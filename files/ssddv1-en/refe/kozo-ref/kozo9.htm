<H1>SPRITE</H1>

<P ALIGN="right">
<B> Sprite data </​​B>
</P>

<H3> Structure </H3>
<PRE>
typedef   struct    {
                    Uint16 CTRL ;
                    Uint16 LINK ;
                    Uint16 PMOD ;
                    Uint16 COLR ;
                    Uint16 SRCA ;
                    Uint16 SIZE ;
                    Uint16 XA ;
                    Uint16 YA ;
                    Uint16 XB ;
                    Uint16 YB ;
                    Uint16 XC ;
                    Uint16 YC ;
                    Uint16 XD ;
                    Uint16 YD ;
                    Uint16 GRDA ;
                    Uint16 DMMY ;
          } SPRITE ;
</PRE>

<H3> Member </H3>
<PRE>
CTRL control function
LINK Link address
PMOD put mode
COLR color data
SRCA CG address
SIZE Character size
XA X coordinate component of display position A
YA Ｙ Y coordinate component
XB X coordinate component of display position B
YB 〃 Y coordinate component
XC X coordinate component of display position C
YC 〃 Y coordinate component
XD X coordinate component of display position D
YD 〃 Y coordinate component
GRDA Gouraud Shading Table
DMMY Size-matching dummy data
</PRE>

<H3> Description </H3>
<P>
Data type for passing data directly to VDP1, which means a data table for displaying sprites. <BR>
Sprite picture data must be stored and registered in VRAM in advance (same for texture data and scroll data). <BR>
For details, please refer to Programmer's Tutorial “Chapter 7: Polygon face attributes”.
</P>

<H3> Remarks </H3>
<P>
The textures and sprites used in Sega Saturn have very similar data structures, but display them differently as follows:
Texture: Display pasted on polygon surface
Sprite: Displayed by sprite alone
</P>

<P> Reference: Chapter 7 Polygon surface attributes </P>
