<H1>TEXTURE</H1>

<P ALIGN="right">
<B> Texture data </​​B>
</P>

<H3> Structure </H3>
<PRE>
typedef   struct    {
                    Uint16 Hsize ;
                    Uint16 Vsize ;
                    Uint16 CGadr ;
                    Uint16 HVsize ;
          } TEXTURE ;
</PRE>

<H3> Member </H3>
<PRE>
Hsize Horizontal size of texture
Vsize Vertical size of texture
CG address of CGadr texture / 8
HVsize Horizontal size / 8, Vertical size (for hardware) <BR>
          ((H SIZE/8)&lt;&lt;8) | (V SIZE)
</PRE>

<H3> Description </H3>
<P>
This is a texture management table for using textures in SGL.
</P>

<H3> Remarks </H3>
<P>
For details, refer to Programmer's Tutorial “Chapter 7: Polygon Face Attributes”.
</P>

<P> Reference: Chapter 7 Polygon surface attributes </P>
