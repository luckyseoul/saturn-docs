<H4>図1-1　セガ推奨開発環境</H4>
<IMG SRC="../grp/sega1.gif">

<P>
セガでは図のような開発環境を推奨しています。<BR>
ネットワークを用いた統合環境下ではUNIXサーバのもとで、プログラマ用にSGIまたはPC、デザイナー用にSGIまたはMacintosh、サウンド用にMacintoshを加えるという形が望ましいと思われます。
