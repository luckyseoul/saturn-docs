<HR NOSHADE>
<DL>
	<P><DT><H2>■編集メニュー</H2>
<A NAME="no1_62"></A>
	<P ALIGN=CENTER><IMG SRC="../grp/i003_01.gif"></P>
	<P><DT>	『3D Editor』では使用される機会の少ないメニューですが、マテリアルの設定に関するコピーペースト時に大きな力を発揮します。また、マニュアルによる３角形ポリゴンの結合時にはやり直しメニューが使用できます。</P>
