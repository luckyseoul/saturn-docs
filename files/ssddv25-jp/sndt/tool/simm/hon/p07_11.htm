<DL>
	<P><DT><H3>フルパス表示</H3>
	<P><DD>データやフォルダーをドラッグ等で移動した場合に、以前に登録したフォルダー位置に指定ファイルがなくファイルデータが読み込めないというようなことが起こります。
ファイル名をクリックで選択してから［フルパス表示］をクリックすると、そのファイルが登録してあるフォルダーのフルパスが表示されます。<BR></P>

</DL>
