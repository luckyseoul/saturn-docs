<HTML><HEAD><meta http-equiv="content-type" content="text/html; charset=UTF-8" /><TITLE>&lt; 9/12&gt;FAQ/サウンド関連/AIFF</TITLE><script>
  window.onload = function loadedFunction() {
    var rootFolders = [ 'faq', 'grph', 'hard', 'info', 'movi', 'prgg', 'sgl', 'sndt', 'soft', 'what', 'xhistory', 'xindex' ];
    var pathNameSegments = window.location.pathname.split("/")
    var rootIndex = pathNameSegments.findIndex(x => rootFolders.includes(x))
    var pageName = pathNameSegments.slice(rootIndex).join('/');
    if (window.self == window.top) {
      window.top.location.href = pathNameSegments.slice(0, rootIndex).join('/') + '/index.html?page=' + pageName;
    }
    else {
      window.top.postMessage(pageName,'*');
    }
  }</script>
