<!DOCTYPE html SYSTEM "about:legacy-compat">
<html>
  <head>
    <META http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>SEGASATURN Developer's Documentation</title>
    <link href="favicon.ico" rel="icon">
    <link href="styles/DocStyle.css" rel="stylesheet" type="text/css">
    <script>
    window.addEventListener('message', (event) => { window.history.replaceState(null, null, window.location.pathname + '?page=' + event.data); }, false);
    window.onload = function loadedFunction() { 
    if (window.top.location.search != '') {
      document.getElementsByName("manual_window")[0].src = window.location.pathname.slice(0, window.location.pathname.lastIndexOf('/')) + '/' + new URLSearchParams(window.top.location.search).get('page');
    }
  }</script></head>
  <body class="mainBody">
    <div class="mainFrameSet">
      <iframe src="xindex/tree.htm" name="index_window" class="tocFrameClass"></iframe>
      <iframe src="index.htm" name="manual_window" class="docFrameClass"></iframe>
    </div>
  </body>
</html>
