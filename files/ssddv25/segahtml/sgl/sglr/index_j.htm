<HTML><HEAD><meta http-equiv="content-type" content="text/html; charset=UTF-8" /><TITLE>SGL MANUAL INDEX</TITLE><script>
  window.onload = function loadedFunction() {
    var rootFolders = [ 'faq', 'grph', 'hard', 'info', 'movi', 'prgg', 'sgl', 'sndt', 'soft', 'what', 'xhistory', 'xindex' ];
    var pathNameSegments = window.location.pathname.split("/")
    var rootIndex = pathNameSegments.findIndex(x => rootFolders.includes(x))
    var pageName = pathNameSegments.slice(rootIndex).join('/');
    if (window.self == window.top) {
      window.top.location.href = pathNameSegments.slice(0, rootIndex).join('/') + '/index.html?page=' + pageName;
    }
    else {
      window.top.postMessage(pageName,'*');
    }
  }</script>
</HEAD><BODY><A HREF="javascript:window.location.href = window.location.pathname.replace('_j.htm', '.htm');" style="position:absolute; top:20px; right:20px;">English</A><HR><HR NOSHADE><CENTER><H1>SGL User's Manual</H1><H4>SEGASATURN 3D GAME LIBRARY</H4></CENTER><HR NOSHADE><DL>	<P>	<DT><H2>『ＳＧＬ　リファレンス』</H2>	<P>	<DD><H3><a href="func/index_j.htm">関数リファレンス</A></H3>	<P>	<DD><H3><a href="struct/index_j.htm">構造体リファレンス</A></H3>	<P>	<DD><H3><a href="mem/index_j.htm">メモリマップ</A></H3>	<P>	<DD><H3><a href="hosoku/hosoku_j.htm">SGL補足マニュアル</A></H3></DL><HR NOSHADE><HR><ADDRESS>Copyright SEGA ENTERPRISES, LTD., 1997</ADDRESS></BODY></HTML>
